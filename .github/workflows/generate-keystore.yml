name: Generate Upload Keystore (Run Once)

on:
  workflow_dispatch:
    inputs:
      store_password:
        description: 'Keystore password (remember this!)'
        required: true
      key_password:
        description: 'Key password (can be same as store password)'
        required: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore my-upload-key.jks \
            -alias upload \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ github.event.inputs.store_password }}" \
            -keypass "${{ github.event.inputs.key_password }}" \
            -dname "CN=Siddhartha, OU=Dev, O=QRCodeScanner, L=City, ST=State, C=IN"

      - name: Upload keystore as artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-upload-key
          path: my-upload-key.jks
